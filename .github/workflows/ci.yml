name: Release quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: ci_ephemeral_test_only
          POSTGRES_DB: macro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U macro -d macro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MONITOR_ENABLED: 'false'
      DATABASE_URL: sqlite://
      CI_PG_PASSWORD: ci_ephemeral_test_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            showcase/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            scripts/release/requirements-checks.txt
      - name: Scan clean public source
        run: |
          python scripts/release/scan_public.py --root .
          python scripts/release/check_docs.py
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.lock -r scripts/release/requirements-checks.txt
          python -m pip install --no-deps -e backend
          npm ci --prefix frontend
          npm ci --prefix showcase
      - name: Original full frontend tests and types
        run: |
          npm test --prefix frontend
          npm run typecheck --prefix frontend
      - name: Configure disposable PostgreSQL test URL
        run: python -c "import os; from urllib.parse import quote; f=open(os.environ['GITHUB_ENV'],'a'); f.write('TEST_DATABASE_URL=' + 'postgresql+psycopg://' + 'macro:' + quote(os.environ['CI_PG_PASSWORD'],safe='') + '@127.0.0.1:5432/macro_test' + '\n'); f.close()"
      - name: Original full backend tests with SQLite and PostgreSQL
        run: python -m pytest backend/tests -q
      - name: Snapshot schema and permission gates
        run: |
          python scripts/release/validate_snapshot.py
          python scripts/release/test_release.py
      - name: Static frontend tests and TypeScript
        run: |
          npm test --prefix showcase
          npm run typecheck --prefix showcase
      - name: Dependency vulnerability checks
        run: |
          npm audit --prefix frontend --audit-level=moderate
          npm audit --prefix showcase --audit-level=moderate
          python -m pip_audit -r backend/requirements.lock --no-deps --disable-pip
      - name: Static export and artifact scan
        run: |
          npm run build --prefix showcase
          node scripts/release/check-static.mjs
          python scripts/release/scan_public.py --root showcase/out
      - name: Links and deep-route HTTP checks
        run: python scripts/release/test_routes.py
      - name: Preserve full local terminal build
        run: npm run build --prefix frontend
